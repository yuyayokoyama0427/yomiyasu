<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- 左紫アクセント -->
  <rect width="12" height="630" fill="#7c3aed"/>
  <!-- メインカード -->
  <rect x="60" y="80" width="1080" height="470" rx="24" fill="white" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#0000001a"/>
    </filter>
  </defs>
  <!-- アイコン -->
  <rect x="100" y="130" width="100" height="100" rx="20" fill="#7c3aed"/>
  <text x="150" y="198" font-size="60" font-family="sans-serif" fill="white" text-anchor="middle">読</text>
  <!-- サービス名 -->
  <text x="220" y="175" font-size="52" font-weight="bold" font-family="sans-serif" fill="#111827">Yomiyasu</text>
  <text x="220" y="215" font-size="24" font-family="sans-serif" fill="#6b7280">日本語文章チェックツール</text>
  <!-- 区切り線 -->
  <line x1="100" y1="260" x2="1100" y2="260" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- 特徴リスト -->
  <text x="100" y="320" font-size="28" font-family="sans-serif" fill="#374151">✅  文章を貼り付けるだけで読みやすさを自動チェック</text>
  <text x="100" y="375" font-size="28" font-family="sans-serif" fill="#374151">✅  長文・語尾・助詞ミスなど5項目を無料で検出</text>
  <text x="100" y="430" font-size="28" font-family="sans-serif" fill="#374151">✅  各指摘に修正例つき・コピーボタン付き</text>
  <!-- URL -->
  <text x="100" y="505" font-size="24" font-family="sans-serif" fill="#7c3aed">yomiyasu.vercel.app</text>
  <!-- Pro バッジ -->
  <rect x="880" y="470" width="240" height="52" rx="26" fill="#7c3aed"/>
  <text x="1000" y="503" font-size="22" font-family="sans-serif" fill="white" text-anchor="middle" font-weight="bold">Pro版 月額300円</text>
</svg>
